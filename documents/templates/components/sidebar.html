<header class="product-nav" aria-label="Primary navigation">
    <a class="brand-lockup" href="{% url 'dashboard' %}" aria-label="Tender Intelligence home">
        <span class="brand-mark">TI</span>
        <span class="brand-name">Tender Intelligence</span>
    </a>

    <nav class="nav-stack">
        <a class="nav-link {% if active_nav == 'documents' %}is-active{% endif %}" href="{% url 'dashboard' %}">Documents</a>
        <a class="nav-link {% if active_nav == 'research' %}is-active{% endif %}" href="{% url 'research-lab' %}">Research Lab</a>
    </nav>

    <div class="nav-account">
        <span class="user-name">{{ request.user.username }}</span>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="text-button" type="submit">Sign out</button>
        </form>
    </div>
</header>
